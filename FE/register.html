<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee TakeAway | Đăng ký</title>
    <meta name="description" content="Tạo tài khoản mới tại Coffee TakeAway.">
    <link rel="icon" type="image/png" href="assets/images/logo/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="logo">
                <img src="assets/images/logo/logo.png" alt="Coffee TakeAway Logo" onerror="this.style.display='none'">
                <h1>Coffee TakeAway</h1>
                <p>Tạo tài khoản mới</p>
            </div>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="full_name">Họ và tên</label>
                    <input type="text" id="full_name" placeholder="Nguyễn Văn A" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="email@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" placeholder="0901 234 567" autocomplete="tel">
                </div>

                <button type="submit" class="btn-login">Đăng ký</button>

            </form>

            <p id="message" class="message"></p>

            <div class="bottom-link">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>

        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>

</body>
</html>
