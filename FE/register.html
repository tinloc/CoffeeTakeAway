<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="login-container">

<div class="login-card">

<h2>Đăng ký tài khoản</h2>

<form id="registerForm">

<input
type="text"
id="full_name"
placeholder="Họ và tên"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Mật khẩu"
required>

<input
type="text"
id="phone"
placeholder="Số điện thoại">

<button type="submit">

Đăng ký

</button>

</form>

<p id="message"></p>

<p>

<a href="login.html">

Đã có tài khoản? Đăng nhập

</a>

</p>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
