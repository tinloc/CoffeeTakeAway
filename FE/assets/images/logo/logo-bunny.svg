<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2016"/>
      <stop offset="100%" stop-color="#6F4E37"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#6F4E37"/>
    </linearGradient>
  </defs>

  <!-- Left ear outer -->
  <ellipse cx="34" cy="30" rx="12" ry="22" fill="url(#earGrad)"/>
  <!-- Left ear inner -->
  <ellipse cx="34" cy="31" rx="6" ry="14" fill="#D4A373"/>

  <!-- Right ear outer -->
  <ellipse cx="66" cy="30" rx="12" ry="22" fill="url(#earGrad)"/>
  <!-- Right ear inner -->
  <ellipse cx="66" cy="31" rx="6" ry="14" fill="#D4A373"/>

  <!-- Head -->
  <circle cx="50" cy="68" r="30" fill="url(#headGrad)"/>

  <!-- Left eye white -->
  <circle cx="41" cy="63" r="6" fill="white"/>
  <!-- Right eye white -->
  <circle cx="59" cy="63" r="6" fill="white"/>

  <!-- Left pupil -->
  <circle cx="42" cy="64" r="3.2" fill="#1A0A00"/>
  <!-- Right pupil -->
  <circle cx="60" cy="64" r="3.2" fill="#1A0A00"/>

  <!-- Eye shine left -->
  <circle cx="43.5" cy="62" r="1.3" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="61.5" cy="62" r="1.3" fill="white"/>

  <!-- Nose -->
  <ellipse cx="50" cy="72" rx="4.5" ry="3" fill="#D4A373"/>

  <!-- Mouth -->
  <path d="M 46 77 Q 50 83 54 77" stroke="#4B2E2B" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Blush left -->
  <circle cx="35" cy="75" r="7.5" fill="#D4A373" opacity="0.32"/>
  <!-- Blush right -->
  <circle cx="65" cy="75" r="7.5" fill="#D4A373" opacity="0.32"/>
</svg>
